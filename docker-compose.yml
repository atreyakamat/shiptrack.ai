version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://shiptrack:shiptrack_pass@db:5432/shiptrack
      - SECRET_KEY=${SECRET_KEY:-generate-a-secure-secret-key-here}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      - API_URL=http://nginx:80/api
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=shiptrack
      - POSTGRES_PASSWORD=shiptrack_pass
      - POSTGRES_DB=shiptrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiptrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
