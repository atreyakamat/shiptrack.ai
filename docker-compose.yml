# ShipTrack AI — containerised stack (Flask API + Next.js UI + Postgres).
#
# Runs in DEMO mode: the India Post live lookup needs a human to solve a CAPTCHA in a
# real browser window, which a headless container cannot provide. Demo mode serves the
# full UI on realistic mock shipments. For automatic live tracking, set an aggregator
# (TRACKING_PROVIDER=trackingmore, TRACKING_DEMO_MODE=false, TRACKING_API_KEY=...).
#
# Start:  docker compose up --build
# UI:     http://localhost:3000   (login: demo@shiptrack.ai / demo12345)

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shiptrack
      POSTGRES_PASSWORD: shiptrack_pass
      POSTGRES_DB: shiptrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiptrack"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql+psycopg2://shiptrack:shiptrack_pass@db:5432/shiptrack
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      TRACKING_PROVIDER: ${TRACKING_PROVIDER:-mock}
      TRACKING_DEMO_MODE: ${TRACKING_DEMO_MODE:-true}
      TRACKING_API_KEY: ${TRACKING_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      # Seed a demo account + sample shipments on first boot.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-demo@shiptrack.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo12345}
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
