services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://shiptrack:shiptrack_pass@db:5432/shiptrack
      - SECRET_KEY=${SECRET_KEY:-generate-a-secure-secret-key-here}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "backend/scheduler.py"]
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://shiptrack:shiptrack_pass@db:5432/shiptrack
      - SECRET_KEY=${SECRET_KEY:-generate-a-secure-secret-key-here}
      - SCHEDULER_ENABLED=true
      - REFRESH_INTERVAL_MINUTES=${REFRESH_INTERVAL_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      - API_URL=http://nginx:80/api
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shiptrack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-shiptrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiptrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
